name: health

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  check:
    name: Links and assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # open, comment on and close the broken-links report issue

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every image in the README is a local file. Verifying they exist is a plain
      # filesystem check — no network, no false positives from the ?v= cache-buster
      # that a link checker would try to resolve as part of the path.
      - name: Verify every referenced asset exists
        run: |
          set -euo pipefail
          missing=0
          while read -r asset; do
            if [ ! -f "$asset" ]; then
              echo "::error file=README.md::Referenced asset is missing: $asset"
              missing=1
            fi
          done < <(grep -oE 'assets/[A-Za-z0-9._-]+\.svg' README.md | sort -u)
          if [ "$missing" -ne 0 ]; then
            echo "One or more generated cards are referenced but absent."
            exit 1
          fi
          echo "All referenced assets are present."

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --exclude-path assets
            --exclude '^assets/'
            README.md README.tpl.md
          output: lychee-report.md
          fail: false

      - name: Open an issue when something is broken
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Profile health check: broken links"

          {
            echo "The weekly health check found links that no longer resolve."
            echo
            cat lychee-report.md
            echo
            echo "[Workflow run]($RUN_URL)"
          } > body.md

          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"

          # Update the existing report rather than opening a new issue every week.
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            # The label may not exist yet on a fresh repo; its absence must not
            # stop the report from being filed.
            gh label create automated --color ededed \
              --description "Opened by a workflow" 2>/dev/null || true
            gh issue create --title "$title" --body-file body.md --label automated
          fi

      - name: Close the issue when everything resolves
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Profile health check: broken links"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All links resolve again — closed automatically."
          fi
