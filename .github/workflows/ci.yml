name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Regenerations commit with [skip ci], and a cancelled run can only be re-run against the
  # commit it started on. Without this there is no way to check current main on demand.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Runs the real build against the live API and writes nothing. This catches the
      # failures that matter — a template marker with no matching section, a card that
      # throws, a GraphQL query that no longer parses — without gating on live data,
      # which changes daily and would fail every PR for unrelated reasons.
      - name: Dry-run the generator
        run: npm run dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown:
    name: Lint markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run markdownlint
        run: npx --yes markdownlint-cli2 "README.md" "README.tpl.md"
